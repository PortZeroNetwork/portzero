name: VM E2E (Parallels)

# Hardware-in-the-loop coverage that CI's hosted runners can't give: real
# installers, real trust stores, real TUN/wintun adapters, driven end to end
# on genuine Windows/Linux/macOS guests. See vmtest/README.md.
#
# windows/linux/macOS binaries are all built on hosted runners (build-windows,
# build-linux, build-macos below) and pushed into the guests, so vm-test
# always exercises the commit under test — not whatever was last baked into a
# VM's "built" snapshot by hand. The org's one self-hosted macOS runner is the
# bottleneck (it also hosts the Parallels VMs and serializes every vm-test
# matrix leg), so every build that a GitHub-hosted runner can do instead stays
# off it; only the vmkit-driven guest steps run there. See ./vmkit.conf.
#
# vm-test itself still runs on the org's one self-hosted macOS runner (it
# hosts the Parallels VMs under test). vm-test stops any other running VM on
# the host (one-VM-at-a-time enforcement) and reuses this one Mac's Parallels
# install, so it isn't free of side effects on a machine also used
# interactively — acceptable for this org's workflow, worth knowing if that
# changes.
on:
  pull_request:
    branches:
      - staging
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      staging:
        description: "Also run the real cloud-tunnel E2E against staging (creates a throwaway staging test account per platform each run)"
        type: boolean
        default: true

concurrency:
  # Only one vm-test can meaningfully run at a time (single physical Mac,
  # single set of VMs) — queue rather than cancel, so a cancellation can't
  # land mid-test and leave a guest daemon wedged.
  group: vm-e2e
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build windows binary
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p portzero-cli --bin portzero
      - uses: actions/upload-artifact@v5
        with:
          name: portzero-windows
          path: target/release/portzero.exe
          retention-days: 1

  build-linux:
    name: Build linux binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p portzero-cli --bin portzero
      - uses: actions/upload-artifact@v5
        with:
          name: portzero-linux
          path: target/release/portzero
          retention-days: 1

  build-macos:
    name: Build macos binary
    # Built here (GitHub-hosted, Apple Silicon) instead of on the self-hosted
    # runner inside vm-test: it's a plain `cargo build`, needs no vmkit/
    # Parallels access, and every minute it doesn't spend on the org's one
    # self-hosted macOS runner is a minute that runner has free for the guest
    # tests that actually require it. portzero-tray is built alongside
    # portzero so lifecycle-macos.sh / combined-macos.sh have a real tray
    # binary to stage (see VMKIT_ARTIFACT_MACOS / PORTZERO_TRAY_EXE in
    # ./vmkit.conf) — same pair the self-hosted job used to build.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin portzero --bin portzero-tray
      - uses: actions/upload-artifact@v5
        with:
          name: portzero-macos
          path: |
            target/release/portzero
            target/release/portzero-tray
          retention-days: 1

  # Real installable artifacts for the lifecycle test (install -> verify ->
  # uninstall -> assert-clean). Unlike vm-test's raw binaries, these are the
  # actual package a user installs, so the guest exercises the real postinst /
  # prerm (Linux) and the real MSI custom actions (Windows).
  package-linux-deb:
    name: Build linux .deb (lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/crates/app/ui/package-lock.json
      # portzero-app (the desktop app) is one of cargo-deb's packaged assets
      # (see client/crates/cli/Cargo.toml), so it must be built here too —
      # webkit2gtk/GTK for the Tauri build, and the frontend embedded via
      # build.rs, same as release.yml's "Build portzero-app frontend" step.
      - name: Install Linux webkit build deps (for portzero-app)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build portzero-app frontend
        working-directory: client/crates/app/ui
        run: |
          npm ci
          npm run build
      - run: cargo build --release --bin portzero --bin portzero-tray --bin portzero-app
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb -p portzero-cli --no-build
      - uses: actions/upload-artifact@v5
        with:
          name: portzero-deb
          path: target/debian/*.deb
          retention-days: 1

  package-windows-msi:
    name: Build windows MSI (lifecycle, unsigned)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/crates/app/ui/package-lock.json
      # portzero-app.exe (the desktop app) is a required File component in
      # portzero.wxs, so it must be built here too — the frontend is embedded
      # via build.rs, same as release.yml's "Build portzero-app frontend" step.
      - name: Build portzero-app frontend
        working-directory: client/crates/app/ui
        run: |
          npm ci
          npm run build
      - run: cargo build --release --bin portzero --bin portzero-tray --bin portzero-app
      # Assemble the MSI SourceDir exactly as release.yml's "Package (Windows)"
      # does (wintun + VC++ redistributable DLLs the .wxs lists as components),
      # then build an UNSIGNED MSI. Signing is release-only; msiexec installs an
      # unsigned MSI fine under the elevated/SYSTEM context the guest runs in.
      - name: Cache wintun
        uses: actions/cache@v4
        with:
          path: wintun.zip
          key: wintun-0.14.1
      - name: Package payload
        shell: pwsh
        run: |
          $staging = "portzero-windows-amd64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target\release\portzero.exe" "$staging\"
          Copy-Item "target\release\portzero-tray.exe" "$staging\"
          Copy-Item "target\release\portzero-app.exe" "$staging\"

          if (-not (Test-Path "wintun.zip")) {
            Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip" -TimeoutSec 60
          }
          Expand-Archive -Path "wintun.zip" -DestinationPath "wintun" -Force
          Copy-Item "wintun\wintun\bin\amd64\wintun.dll" "$staging\"

          $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requiresAny `
            -requires Microsoft.VisualStudio.Component.VC.Redist.14.Latest Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $redistRoot = Join-Path $vsPath "VC\Redist\MSVC"
          $redistVersionDir = Get-ChildItem -Directory -Path $redistRoot |
            Where-Object { $_.Name -match '^\d+\.' -and (Test-Path (Join-Path $_.FullName "x64")) } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $x64Root = Join-Path $redistVersionDir.FullName "x64"
          $requiredDlls = @(
            "concrt140.dll","msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll",
            "msvcp140_atomic_wait.dll","msvcp140_codecvt_ids.dll","vccorlib140.dll",
            "vcruntime140.dll","vcruntime140_1.dll","vcruntime140_threads.dll"
          )
          foreach ($dllName in $requiredDlls) {
            $dll = Get-ChildItem -Path $x64Root -Recurse -File -Filter $dllName |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $dll) { throw "VC++ redistributable DLL not found: $dllName" }
            Copy-Item $dll.FullName "$staging\" -Force
          }
      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress -y
      - name: Build MSI
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path ".\portzero-windows-amd64").Path
          $wixRoot = "${env:ProgramFiles(x86)}\WiX Toolset*"
          $candle = Get-ChildItem $wixRoot -Recurse -Filter candle.exe | Select-Object -First 1
          $light = Get-ChildItem $wixRoot -Recurse -Filter light.exe | Select-Object -First 1
          if (-not $candle -or -not $light) { throw "WiX candle/light not found" }
          & $candle.FullName "-dProductVersion=0.0.0" "-dSourceDir=$sourceDir" -out "portzero.wixobj" "packaging\windows\portzero.wxs"
          & $light.FullName -out "portzero-0.0.0-x86_64.msi" "portzero.wixobj"
      - uses: actions/upload-artifact@v5
        with:
          name: portzero-msi
          path: "*.msi"
          retention-days: 1

  vm-test:
    name: vm-test (${{ matrix.platform }})
    needs: [build-windows, build-linux, build-macos, package-linux-deb, package-windows-msi]
    runs-on: [self-hosted, macOS]
    timeout-minutes: 75
    strategy:
      # One job per platform so a single platform's failure only needs that
      # platform re-run, not all three. They still execute one-at-a-time in
      # practice: there's exactly one self-hosted macOS runner (see header
      # comment), so GitHub queues these jobs on it serially, and vmkit's
      # one-VM-at-a-time enforcement holds regardless.
      fail-fast: false
      matrix:
        platform: [windows, linux, macos]
    steps:
      - uses: actions/checkout@v5
        # `clean: false` used to matter here so target/ and ~/.cargo — the
        # build cache for the cargo build this job used to run directly on
        # the persistent self-hosted runner — survived between runs. That
        # build is gone (build-macos above does it on a hosted runner
        # instead), so there is nothing left to preserve; a plain clean
        # checkout is simpler and can't accumulate stale cruft across runs.

      - name: Ensure vmkit (VM control plane) is installed
        # The harness runs through vmkit (see ./vmkit.conf and
        # ~/.config/vmkit/host.conf on the runner; `vmkit doctor` validates the
        # host).
        #
        # NOT installed here. vmkit is an internal, private tool and is
        # deliberately not distributed through Homebrew — publishing a formula
        # meant the PUBLIC portzero tap advertised a private repo's name,
        # description and a license it doesn't have, inside the product's own
        # namespace. It is installed on this runner from a checkout
        # (`just install`); see vmkit's README.
        #
        # So: assert it's present and fail loudly if it isn't, rather than
        # silently installing something.
        run: |
          command -v vmkit >/dev/null || {
            echo "::error::vmkit is not installed on this runner."
            echo "Install it from a checkout: git clone git@github.com:PortZeroNetwork/vmkit.git && cd vmkit && just install"
            exit 1
          }
          vmkit version

      # No rust toolchain / cargo here: every binary under test (windows,
      # linux, macos) is now built on a GitHub-hosted runner (build-windows,
      # build-linux, build-macos above) and downloaded below. That keeps the
      # only thing this job compiles-in-place at zero, so the org's one
      # self-hosted macOS runner spends its time on vmkit/Parallels guest work
      # — the thing only it can do — not on cargo builds a hosted runner could
      # do just as well.

      - name: Download macOS binary
        # macOS guest testing is host-built-artifact-only (no toolchain in
        # that guest); vmkit pushes this into the guest itself (see
        # VMKIT_ARTIFACT_MACOS in ./vmkit.conf). Only the macos leg needs this.
        # portzero-tray comes down alongside portzero so the tray/LaunchAgent
        # checks in lifecycle-macos.sh / combined-macos.sh have a real binary
        # to stage into the generated Homebrew formula (PORTZERO_TRAY_EXE
        # defaults to this sibling path when unset).
        if: matrix.platform == 'macos'
        uses: actions/download-artifact@v5
        with:
          name: portzero-macos
          path: target/release

      - name: Restore exec bit on the macOS binaries
        # download-artifact doesn't preserve the exec bit (same as the linux
        # binary below).
        if: matrix.platform == 'macos'
        run: chmod +x target/release/portzero target/release/portzero-tray

      - name: Download windows binary
        if: matrix.platform == 'windows'
        uses: actions/download-artifact@v5
        with:
          name: portzero-windows
          path: vmtest/.downloaded-artifacts/windows

      - name: Download linux binary
        if: matrix.platform == 'linux'
        uses: actions/download-artifact@v5
        with:
          name: portzero-linux
          path: vmtest/.downloaded-artifacts/linux

      - name: Restore exec bit on the linux binary
        # vmkit looks for .downloaded-artifacts/<os>/portzero[.exe] (see
        # downloaded_artifact_host_path); download-artifact doesn't preserve
        # the exec bit.
        if: matrix.platform == 'linux'
        run: chmod +x vmtest/.downloaded-artifacts/linux/portzero

      - name: Download linux .deb (lifecycle)
        # lifecycle-linux.sh's find_deb looks here first.
        if: matrix.platform == 'linux'
        uses: actions/download-artifact@v5
        with:
          name: portzero-deb
          path: vmtest/.downloaded-artifacts/linux

      - name: Download windows MSI (lifecycle)
        # lifecycle-windows.ps1's Find-Msi looks here first.
        if: matrix.platform == 'windows'
        uses: actions/download-artifact@v5
        with:
          name: portzero-msi
          path: vmtest/.downloaded-artifacts/windows

      - name: vm-test (install -> local-tunnel -> upgrade -> cloud-tunnel -> uninstall)
        # One VM reset per platform covers what four separate steps used to
        # check across four separate resets: installs the real package (prior
        # released version if available, else the new one directly), proves the
        # real local overlay (.portzero.local via TUN) works, upgrades to the new
        # version and asserts nothing got duplicated (the audit's highest-priority
        # gap — trusted CA, DNS resolver/pin, autostart service, TUN interface all
        # asserted GONE after uninstall), proves the real cloud tunnel works
        # against staging, then uninstalls. See vmkit.conf VMKIT_FLAVOR_COMBINED_*
        # and vmtest/scripts/combined-*. Each matrix leg passes its own platform
        # to `just vm-test`, which vmkit runs in isolation for that platform.
        #
        # The cloud-tunnel step always runs here (a manual dispatch can pass
        # staging=false to skip it via COMBINED_SKIP_CLOUD). NOTE: on push/PR
        # `inputs.staging` is null, and GitHub's loose comparison treats
        # null == false as EQUAL, so gate on the event name instead.
        #
        # Rotated seed token for the cloud-tunnel step: read from the same
        # host-side file the interactive scripts already default to (this
        # runner IS the host that owns that file — no GitHub secret needed).
        # See VMKIT_SECRETS_HOST_DEFAULT in ./vmkit.conf.
        #
        # Prior-version artifacts for the upgrade step are fetched via gh, or
        # the step SKIPs cleanly (never a false fail) when none is available
        # (e.g. before the first release). Linux upgrade dup-checks are also
        # covered on hosted CI (ci.yml: lifecycle-upgrade-linux).
        env:
          GH_TOKEN: ${{ github.token }}
          COMBINED_SKIP_CLOUD: ${{ (github.event_name == 'workflow_dispatch' && !inputs.staging) && '1' || '' }}
        run: just vm-test ${{ matrix.platform }}

      - name: autoupdate (real `portzero update` against a local release mirror)
        # Separate hermetic reset per platform: install the built binary, then
        # drive the actual `portzero update` self-updater against a throwaway
        # local version.json + archive and assert it detects, downloads, unpacks,
        # and swaps the binary in place. This is the path that, if it ever breaks
        # in a shipped release, silently stops every installed user from updating —
        # so it gets its own pass rather than riding on the combined install flow.
        # No secrets and no gh needed: the mirror is built in-guest from the same
        # binary vm-test already staged; the gated cross-version advance stays a
        # clean SKIP until a prior release that understands `update` is published.
        run: just vm-test-autoupdate ${{ matrix.platform }}
